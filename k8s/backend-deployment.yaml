apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: rag-backend:latest
        imagePullPolicy: Never # Crucial: dit à K8s d'utiliser l'image locale
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP # Le frontend communiquera avec le backend en interne
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000